services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cubesat_server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cubesat_client
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://server:3001
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped
